[project]
name = "ai-tools"
version = "0.1.0"
description = "Command-line tools for OCR, audio, TTS, PDF review and web capture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # API clients and general utilities
    "httpx>=0.28.1",
    "huggingface-hub[cli]>=0.36.2",
    "mistralai>=1.9.11,<2.0.0",          # pdf2md.py --model mistral
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "rich>=14.2.0",
    "tiktoken>=0.12.0",                  # count_tokens.py
    # Bibliography (merge_bib.py, scopus_rank.py)
    "bibtexparser>=1.4.4,<2",
    # Code flowcharts (flowchart.py)
    "tree-sitter==0.21.3",
    "tree-sitter-c==0.21.4",
    "tree-sitter-cpp==0.22.3",
    # Web capture (url2md.py, html2png.py, slides2pdf.py)
    "beautifulsoup4>=4.12",
    "chardet>=5.2",
    "markdown-it-py>=4.0.0",
    "markdownify>=0.13",
    "playwright>=1.48",
    "readability-lxml>=0.8.1",
    "trafilatura>=1.12",
    "yt-dlp>=2024.12.13",                # youtube2audio.py
    # Audio transcription and processing
    "demucs>=4.0.1",                     # demucs_separate.py
    "faster-whisper>=1.1.0",
    "numpy>=2.2.2",
    "pydub>=0.25.1",                     # mix_audio.py
    "sounddevice>=0.5.1",
    "soundfile>=0.13.1",
    # Text-to-speech and voice reference (md2audio.py, voice_ref.py)
    "num2words>=0.5.14",
    "qwen-tts>=0.1.1",
    "rapidfuzz>=3.14.5",
    # GUI (audio_transcribe_gui.py)
    "customtkinter>=5.2.2",
    # PDF and image OCR (pdf2md.py, png2md.py, pdf_review.py)
    "easyocr>=1.7.2",
    "pillow",
    "pycryptodome>=3.23.0",
    "pymupdf>=1.24",
    "pypdf2>=3.0.1",
    "pypdfium2>=5.6.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=5.13",
]

[tool.uv]
package = false

[tool.black]
line-length = 120
target-version = ['py311', 'py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
